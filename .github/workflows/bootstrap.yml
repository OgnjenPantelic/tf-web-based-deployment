name: Bootstrap (one-time)

# Creates the GitHub-OIDC identity + Terraform remote-state storage that deploy.yml
# and destroy.yml rely on. This is the one workflow that cannot use OIDC (it is what
# creates the OIDC identity), so it authenticates with a TEMPORARY privileged service
# principal secret. Delete that secret once bootstrap has run successfully.
#
# The temporary SP needs: subscription Owner + the Application Administrator directory
# role (to create the app registration, federated credentials, and role assignments).
on:
  workflow_dispatch:
    inputs:
      state_storage_account:
        description: "Globally-unique storage account name for TF state (3-24 lowercase alphanumeric)."
        required: true
        type: string
      location:
        description: "Azure region for the state storage account."
        required: false
        default: "westeurope"
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Temporary secret AZURE_BOOTSTRAP_CREDENTIALS is the JSON:
      # {"clientId":"...","clientSecret":"...","subscriptionId":"...","tenantId":"..."}
      - name: Azure login (temporary service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_BOOTSTRAP_CREDENTIALS }}

      - name: Run bootstrap
        env:
          STATE_STORAGE_ACCOUNT: ${{ inputs.state_storage_account }}
          LOCATION: ${{ inputs.location }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: bash bootstrap/bootstrap.sh
